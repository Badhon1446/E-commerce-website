{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow border-0 text-center p-5">

                <div class="mb-4">
                    <i class="fas fa-times-circle text-danger" style="font-size:80px;"></i>
                </div>

                <h2 class="fw-bold text-danger mb-3">
                    Payment Failed!
                </h2>

                <p class="text-muted mb-4">
                    Unfortunately your payment could not be completed.
                    Please try again.
                </p>

                <div class="d-grid gap-3">

                    <a href="{% url 'e_shop:checkout' %}"
                       class="btn btn-danger btn-lg">
                        Try Again
                    </a>

                    <a href="{% url 'e_shop:cart_detail' %}"
                       class="btn btn-outline-dark">
                        Back To Cart
                    </a>

                </div>

            </div>

        </div>
    </div>
</div>

{% endblock %}
